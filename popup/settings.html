<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="settings.css">
  </head>

  <body>
    <div id="settings">
      <label class="setting">
        <span>Hide Shorts</span>
        <span class="switch">
          <input type="checkbox" id="hide-shorts">
          <span class="slider"></span>
        </span>
      </label>
      <label class="setting">
        <span>Hide Shorts menu item</span>
        <span class="switch">
          <input type="checkbox" id="hide-guide-menu-shorts-entry">
          <span class="slider"></span>
        </span>
      </label>
    </div>
    <script src="settings.js"></script>
  </body>

</html>
